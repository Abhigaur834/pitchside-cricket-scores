<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>PitchSide – Live Cricket Scores</title>
<style>
:root{--g:#087a59;--bg:#eef2f0;--card:#fff;--tx:#18211e;--mu:#68756f;--ln:#dce4e0;--red:#d93025}
*{box-sizing:border-box}body{margin:0;font:14px system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--tx)}
header{background:var(--g);color:#fff;position:sticky;top:0;z-index:5}.bar{max-width:1000px;margin:auto;padding:12px 16px 0}.logo{font-size:22px;font-weight:800;color:#fff;text-decoration:none}
.tabs{display:flex;gap:4px;margin-top:8px}.tab,.chip{cursor:pointer;border:0;background:none;font:600 14px system-ui;padding:9px 14px}.tab{color:#cfeee4;border-bottom:3px solid transparent}.tab[aria-selected=true]{color:#fff;border-color:#fff}
main{max-width:1000px;margin:auto;padding:16px}.tools{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}.tools input{flex:1;min-width:200px;padding:9px 12px;border:1px solid var(--ln);border-radius:7px;background:var(--card);color:var(--tx)}
.chip{border:1px solid var(--ln);background:var(--card);color:var(--tx);border-radius:999px}.chip[aria-pressed=true]{background:var(--g);color:#fff;border-color:var(--g)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}.card{display:block;background:var(--card);border:1px solid var(--ln);border-radius:8px;padding:14px;color:inherit;text-decoration:none}.card:hover{border-color:var(--g)}
.meta{display:flex;justify-content:space-between;color:var(--mu);font-size:12px;margin-bottom:7px}.badge{color:var(--red);font-weight:700}.badge.done{color:var(--mu)}.badge.soon{color:var(--g)}
.row{display:flex;justify-content:space-between;align-items:center;padding:6px 0;font-size:16px}.team{font-weight:650}.sc{font-weight:750}.sc small{font-weight:400;color:var(--mu);margin-left:4px}.mname{font-size:13px;color:var(--mu);margin-bottom:3px}.status{border-top:1px solid var(--ln);margin-top:8px;padding-top:8px;color:var(--g);font-weight:600}
.note,.empty{color:var(--mu)}.empty{text-align:center;padding:40px}.demo,.err{padding:9px 12px;border-radius:7px;margin-bottom:12px}.demo{background:#fff4d6;color:#5b4500}.err{background:#fde8e6;color:#8a1c14}.back{color:var(--g);font-weight:700;text-decoration:none;display:inline-block;margin-bottom:12px}
h2{font-size:17px;margin:20px 0 8px}.tbl{overflow:auto;background:var(--card);border:1px solid var(--ln);border-radius:8px}table{border-collapse:collapse;width:100%;min-width:470px}th,td{padding:8px 10px;border-bottom:1px solid var(--ln);text-align:right;font-variant-numeric:tabular-nums}th:first-child,td:first-child{text-align:left}th{font-size:12px;color:var(--mu);background:var(--bg)}.dis{font-size:12px;color:var(--mu)}.tot{padding:8px 10px;color:var(--mu)}
</style></head><body>
<header><div class="bar"><a class="logo" href="#/">PitchSide</a><div class="tabs" id="tabs">
<button class="tab" data-t="live" aria-selected="true">Live</button><button class="tab" data-t="recent" aria-selected="false">Recent</button><button class="tab" data-t="upcoming" aria-selected="false">Upcoming</button></div></div></header>
<main id="app"></main>
<script>
const API_BASE="";const REFRESH=30000;
const SAMPLE=[{id:"demo1",name:"India vs Australia, 2nd T20I",matchType:"t20",status:"India need 41 runs in 28 balls",venue:"Wankhede Stadium, Mumbai",matchStarted:true,matchEnded:false,teams:["India","Australia"],score:[{r:176,w:6,o:20,inning:"Australia Inning 1"},{r:136,w:4,o:16.2,inning:"India Inning 1"}]},{id:"demo2",name:"England vs South Africa, 3rd Test",matchType:"test",status:"Day 2: Stumps - South Africa lead by 58 runs",venue:"Lord's, London",matchStarted:true,matchEnded:false,teams:["England","South Africa"],score:[{r:312,w:10,o:88.4,inning:"England Inning 1"},{r:370,w:7,o:101,inning:"South Africa Inning 1"}]},{id:"demo3",name:"Pakistan vs New Zealand, 1st ODI",matchType:"odi",status:"Pakistan won by 5 wickets",venue:"Gaddafi Stadium, Lahore",matchStarted:true,matchEnded:true,teams:["Pakistan","New Zealand"],score:[{r:271,w:9,o:50,inning:"New Zealand Inning 1"},{r:274,w:5,o:47.3,inning:"Pakistan Inning 1"}]},{id:"demo4",name:"Sri Lanka vs Bangladesh, 1st T20I",matchType:"t20",status:"Match starts Sep 30",venue:"Colombo",matchStarted:false,matchEnded:false,teams:["Sri Lanka","Bangladesh"],score:[]}];
const DEMO_CARD=[{inning:"Australia Inning 1",totals:{R:176,W:6,O:20},extras:{r:9},batting:[{batsman:{name:"T Head"},"dismissal-text":"c Kohli b Bumrah",r:48,b:27,"4s":6,"6s":2,sr:177.8},{batsman:{name:"T David"},"dismissal-text":"not out",r:44,b:19,"4s":2,"6s":4,sr:231.6}],bowling:[{bowler:{name:"J Bumrah"},o:4,m:0,r:29,w:2,eco:7.25}]},{inning:"India Inning 1",totals:{R:136,W:4,O:16.2},extras:{r:6},batting:[{batsman:{name:"R Sharma"},"dismissal-text":"c David b Starc",r:36,b:21,"4s":4,"6s":2,sr:171.4},{batsman:{name:"V Kohli"},"dismissal-text":"not out",r:61,b:40,"4s":5,"6s":2,sr:152.5}],bowling:[{bowler:{name:"M Starc"},o:3.2,m:0,r:24,w:2,eco:7.2}]}];
let matches=[],tab="live",fmt="all",q="",demo=false,timer;const $=id=>document.getElementById(id),esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const kind=m=>!m.matchStarted?"upcoming":m.matchEnded?"recent":"live",api=p=>fetch(API_BASE+p).then(r=>{if(!r.ok)throw Error(r.status);return r.json()});
function score(m,t){return(m.score||[]).filter(x=>String(x.team||x.inning||"").toLowerCase().includes(String(t).toLowerCase())).map(x=>esc(x.r)+"/"+esc(x.w??"")+" <small>("+esc(x.o??"")+" ov)</small>").join(" &amp; ")}
function card(m){return'<a class="card" href="#/match/'+encodeURIComponent(m.id)+'"><div class="meta"><span>'+esc((m.matchType||"").toUpperCase())+" · "+esc(m.venue||"")+'</span><b class="badge '+(kind(m)==="recent"?"done":kind(m)==="upcoming"?"soon":"")+'">'+kind(m).toUpperCase()+'</b></div><div class="mname">'+esc(m.name)+'</div>'+(m.teams||[]).map(t=>'<div class="row"><span class="team">'+esc(t)+'</span><span class="sc">'+(score(m,t)||"–")+"</span></div>").join("")+'<div class="status">'+esc(m.status||"")+"</div></a>"}
function shell(){$("app").innerHTML='<div id="demo" class="demo" hidden>Showing demo data. Add CRICKETDATA_API_KEY on Vercel for live data.</div><div class="tools"><input id="q" placeholder="Search team, series or venue"><span id="chips"></span></div><p class="note" id="note"></p><div class="grid" id="grid"></div>';q="";$("q").oninput=e=>{q=e.target.value.toLowerCase();render()};}
function render(){if(!$("grid"))return;$("demo").hidden=!demo;$("chips").innerHTML=[["all","All"],["test","Test"],["odi","ODI"],["t20","T20"]].map(x=>'<button class="chip" data-f="'+x[0]+'" aria-pressed="'+(fmt===x[0])+'">'+x[1]+"</button>").join("");$("chips").onclick=e=>{if(e.target.dataset.f){fmt=e.target.dataset.f;render()}};let a=matches.filter(m=>kind(m)===tab&&(fmt==="all"||String(m.matchType).toLowerCase()===fmt)&&(!q||[m.name,m.venue,...(m.teams||[])].join(" ").toLowerCase().includes(q)));$("grid").innerHTML=a.length?a.map(card).join(""):'<div class="empty">No matches found.</div>';if($("note"))$("note").textContent="Updated "+new Date().toLocaleTimeString()+" · refreshes every 30s"}
async function load(){try{let j=await api("/api/scores");matches=j.matches||[];demo=false}catch{matches=SAMPLE;demo=true}if(!matches.some(m=>kind(m)==="live")&&tab==="live")tab="recent";document.querySelectorAll(".tab").forEach(b=>b.setAttribute("aria-selected",b.dataset.t===tab));render()}
function innings(x){let t=x.totals||{};return'<h2>'+esc(x.inning||"Innings")+'</h2><div class="tbl"><table><thead><tr><th>Batter</th><th>R</th><th>B</th><th>4s</th><th>6s</th><th>SR</th></tr></thead><tbody>'+((x.batting||[]).map(b=>'<tr><td>'+esc(b.batsman?.name??b.batsman)+'<div class="dis">'+esc(b["dismissal-text"]??"")+'</div></td><td>'+esc(b.r??"–")+'</td><td>'+esc(b.b??"–")+'</td><td>'+esc(b["4s"]??"–")+'</td><td>'+esc(b["6s"]??"–")+'</td><td>'+esc(b.sr??"–")+'</td></tr>').join("")||'<tr><td colspan="6">No batting data</td></tr>')+'</tbody></table><div class="tot">Total: <b>'+esc(t.R??"–")+'/'+esc(t.W??"–")+'</b> ('+esc(t.O??"–")+' ov) · Extras: '+esc(x.extras?.r??"0")+'</div></div><h2>Bowling</h2><div class="tbl"><table><thead><tr><th>Bowler</th><th>O</th><th>M</th><th>R</th><th>W</th><th>Econ</th></tr></thead><tbody>'+((x.bowling||[]).map(b=>'<tr><td>'+esc(b.bowler?.name??b.bowler)+'</td><td>'+esc(b.o??"–")+'</td><td>'+esc(b.m??"–")+'</td><td>'+esc(b.r??"–")+'</td><td>'+esc(b.w??"–")+'</td><td>'+esc(b.eco??"–")+'</td></tr>').join("")||'<tr><td colspan="6">No bowling data</td></tr>')+'</tbody></table></div>'}
async function match(id){clearInterval(timer);$("app").innerHTML='<a class="back" href="#/">‹ All matches</a><div id="detail"><p class="note">Loading…</p></div>';async function pull(){try{let j=id.startsWith("demo")?{info:SAMPLE.find(x=>x.id===id)||{},scorecard:DEMO_CARD}:await api("/api/match?id="+encodeURIComponent(id));let m=Object.assign({},matches.find(x=>x.id===id)||{},j.info||{});$("detail").innerHTML='<div class="card"><div class="mname">'+esc(m.name)+'</div>'+((m.teams||[]).map(t=>'<div class="row"><span class="team">'+esc(t)+'</span><span class="sc">'+(score(m,t)||"–")+"</span></div>").join(""))+'<div class="status">'+esc(m.status||"")+'</div></div>'+(j.scorecard||[]).map(innings).join("")+'<p class="note">Updated '+new Date().toLocaleTimeString()+'</p>'}catch{$("detail").innerHTML='<div class="err">Could not load this match. Retrying…</div>'}}await pull();timer=setInterval(()=>{if(!document.hidden)pull()},REFRESH)}
function route(){clearInterval(timer);let h=location.hash;if(h.startsWith("#/match/"))return match(decodeURIComponent(h.slice(8)));document.title="PitchSide – Live Cricket Scores";shell();load();timer=setInterval(()=>{if(!document.hidden)load()},REFRESH)}
$("tabs").onclick=e=>{if(e.target.dataset.t){tab=e.target.dataset.t;location.hash="#/";document.querySelectorAll(".tab").forEach(b=>b.setAttribute("aria-selected",b.dataset.t===tab));render()}};addEventListener("hashchange",route);route();
</script></body></html>
